const API_BASE = "https://tred-map.onrender.com";

function getToken() { return localStorage.getItem("ai_trading_edge_token"); }
function setToken(t) { localStorage.setItem("ai_trading_edge_token", t); }
function clearToken() { localStorage.removeItem("ai_trading_edge_token"); }

async function apiFetch(path, options = {}) {
  const token = getToken();
  const headers = { ...(options.headers || {}) };
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API_BASE + path, { ...options, headers });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`API ${path} failed (${res.status}): ${text}`);
  }
  return res.json();
}

async function registerUser(email, password) {
  const res = await fetch(API_BASE + "/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  if (!res.ok) throw new Error((await res.json()).detail || "Registration failed");
  return res.json();
}

async function loginUser(email, password) {
  const body = new URLSearchParams();
  body.append("username", email);
  body.append("password", password);
  const res = await fetch(API_BASE + "/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body.toString(),
  });
  if (!res.ok) throw new Error((await res.json()).detail || "Login failed");
  return res.json();
}

function genCandles(n = 22) {
  let price = 24780; const out = [];
  for (let i = 0; i < n; i++) {
    const open = price, move = (Math.random() - 0.45) * 40, close = open + move;
    const high = Math.max(open, close) + Math.random() * 15, low = Math.min(open, close) - Math.random() * 15;
    out.push({ i, open, close, high, low }); price = close;
  }
  return out;
}
function genLineSeries(n = 30, start = 24500, drift = 6) {
  let v = start; const out = [];
  for (let i = 0; i < n; i++) { v += (Math.random() - 0.4) * drift * 10; out.push({ i, value: v }); }
  return out;
}

function Candles({ data, height = 130 }) {
  const width = 300;
  const highs = data.map(d => d.high), lows = data.map(d => d.low);
  const max = Math.max(...highs), min = Math.min(...lows), range = max - min || 1;
  const gap = width / data.length;
  const y = v => height - ((v - min) / range) * height;
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none">
      {data.map((d, idx) => {
        const bullish = d.close >= d.open, color = bullish ? COLORS.bullish : COLORS.bearish;
        const x = idx * gap + gap / 2, bodyTop = y(Math.max(d.open, d.close)), bodyBottom = y(Math.min(d.open, d.close));
        return (
          <g key={idx}>
            <line x1={x} x2={x} y1={y(d.high)} y2={y(d.low)} stroke={color} strokeWidth={1} />
            <rect x={x - gap * 0.28} y={bodyTop} width={gap * 0.56} height={Math.max(1, bodyBottom - bodyTop)} fill={color} />
          </g>
        );
      })}
    </svg>
  );
}
function LineSpark({ data, color, height = 36, area = false }) {
  const width = 300;
  const vals = data.map(d => d.value);
  const max = Math.max(...vals), min = Math.min(...vals), range = max - min || 1;
  const gap = width / (data.length - 1);
  const pts = data.map((d, i) => `${i * gap},${height - ((d.value - min) / range) * height}`).join(" ");
  const areaPts = `0,${height} ${pts} ${width},${height}`;
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none">
      {area && <polygon points={areaPts} fill={color} opacity="0.15" />}
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}
function Donut({ data, size = 90 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  let angleAcc = -90;
  const r = size / 2 - 8, cx = size / 2, cy = size / 2;
  const arcs = data.map(d => {
    const angle = (d.value / total) * 360;
    const start = angleAcc, end = angleAcc + angle; angleAcc = end;
    const toRad = a => (a * Math.PI) / 180;
    const x1 = cx + r * Math.cos(toRad(start)), y1 = cy + r * Math.sin(toRad(start));
    const x2 = cx + r * Math.cos(toRad(end)), y2 = cy + r * Math.sin(toRad(end));
    const largeArc = angle > 180 ? 1 : 0;
    return { d: `M${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2}`, color: d.color };
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {arcs.map((a, i) => <path key={i} d={a.d} stroke={a.color} strokeWidth={14} fill="none" strokeLinecap="butt" />)}
    </svg>
  );
}
function SentimentGauge({ value }) {
  const angle = (value / 100) * 180;
  const r = 40, cx = 50, cy = 50;
  const rad = (Math.PI / 180) * (180 - angle);
  const x = cx - r * Math.cos(rad), y = cy - r * Math.sin(rad);
  const largeArc = angle > 180 ? 1 : 0;
  return (
    <svg width="100%" height="70" viewBox="0 0 100 55">
      <path d="M10,50 A40,40 0 0,1 90,50" fill="none" stroke={COLORS.border} strokeWidth="8" strokeLinecap="round" />
      <path d={`M10,50 A40,40 0 ${largeArc},1 ${x},${y}`} fill="none" stroke={COLORS.bullish} strokeWidth="8" strokeLinecap="round" />
    </svg>
  );
}

function AuthScreen({ onAuthed }) {
  const [mode, setMode] = useState("login"); // "login" | "register"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [wakingNote, setWakingNote] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    if (!email || !password) { setError("Enter both email and password."); return; }
    setLoading(true);
    setWakingNote(false);
    const wakeTimer = setTimeout(() => setWakingNote(true), 4000);
    try {
      const data = mode === "login" ? await loginUser(email, password) : await registerUser(email, password);
      setToken(data.access_token);
      onAuthed();
    } catch (err) {
      setError(err.message || "Something went wrong.");
    } finally {
      clearTimeout(wakeTimer);
      setLoading(false);
      setWakingNote(false);
    }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 360, background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: 24 }}>

          {["login", "register"].map(m => (

              key={m}

              onClick={() => { setMode(m); setError(""); }}
              style={{
                flex: 1, padding: "8px 0", borderRadius: 6, border: "none", cursor: "pointer",
                fontSize: 13, fontWeight: 600, textTransform: "capitalize",
                background: mode === m ? COLORS.info : "transparent",
                color: mode === m ? "#fff" : COLORS.textSecondary,
              }}
            >
              {m === "login" ? "Log in" : "Register"}
            </button>
          ))}
        </div>

        <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div>
            <label style={{ fontSize: 12, color: COLORS.textSecondary, display: "block", marginBottom: 4 }}>Email</label>

              style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: `1px solid ${COLORS.border}`, background: COLORS.bg, color: COLORS.textPrimary, fontSize: 14 }}

            <input
              type="password" value={password} onChange={e => setPassword(e.target.value)}

              style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: `1px solid ${COLORS.border}`, background: COLORS.bg, color: COLORS.textPrimary, fontSize: 14 }}

  const displayStocks = bullishStocks || BULLISH_STOCKS.map(s => ({ symbol: s.symbol, ltp: s.price, probability: s.prob, trend: s.trend }));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr 1fr" : "repeat(4, 1fr)", gap: 16 }}>
        <Card title="Market Trend">
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 20, fontWeight: 700, color: COLORS.bullish }}>Bullish</span>
            <Icon path={paths.trendUp} size={18} color={COLORS.bullish} />
          </div>
          <span style={{ fontSize: 12, color: COLORS.textSecondary }}>Strong bullish momentum</span>
          <LineSpark data={overviewSeries.slice(0, 20)} color={COLORS.bullish} />
        </Card>
        <Card title="Advance / Decline">
          <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
            <span style={{ fontSize: 20, fontWeight: 700, color: COLORS.bullish }}>1423</span>
            <span style={{ fontSize: 13, color: COLORS.textSecondary }}>/</span>
            <span style={{ fontSize: 20, fontWeight: 700, color: COLORS.bearish }}>675</span>
          </div>
          <div style={{ display: "flex", height: 8, borderRadius: 4, overflow: "hidden" }}>
            <div style={{ width: "68%", background: COLORS.bullish }} />
            <div style={{ width: "32%", background: COLORS.bearish }} />
          </div>
        </Card>
        <Card title="Market Sentiment">
          <SentimentGauge value={68} />
          <div style={{ textAlign: "center", marginTop: -8 }}>
            <div style={{ fontSize: 20, fontWeight: 700 }}>68%</div>
            <div style={{ fontSize: 12, color: COLORS.bullish }}>Bullish</div>
          </div>
        </Card>
        <Card title="India VIX">
          <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
            <span style={{ fontSize: 20, fontWeight: 700 }}>14.32</span>
            <span style={{ fontSize: 12, color: COLORS.bearish }}>-2.41%</span>
          </div>
          <LineSpark data={vixSeries} color={COLORS.ai} />
        </Card>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1.1fr 1.1fr 1.3fr", gap: 16 }}>
        <Card title="Top 10 Bullish Stocks">
          {loadError && <div style={{ fontSize: 11, color: COLORS.warning }}>{loadError}</div>}
          <div style={{ overflowX: "auto" }}>
            <table style={{ fontSize: 13 }}>
              <thead>
                <tr style={{ color: COLORS.textSecondary, fontSize: 11, textAlign: "left" }}>
                  <th style={{ padding: "4px 6px" }}>#</th><th style={{ padding: "4px 6px" }}>Stock</th>
                  <th style={{ padding: "4px 6px" }}>Price</th><th style={{ padding: "4px 6px" }}>Prob.</th>
                  <th style={{ padding: "4px 6px" }}>Trend</th>
                </tr>
              </thead>
              <tbody>
                {displayStocks.slice(0, 10).map((s, idx) => (
                  <tr key={s.symbol} style={{ borderTop: `1px solid ${COLORS.border}` }}>
                    <td style={{ padding: "6px", color: COLORS.textSecondary }}>{idx + 1}</td>
                    <td style={{ padding: "6px", fontWeight: 600 }}>{s.symbol}</td>
                    <td style={{ padding: "6px" }}>₹{Number(s.ltp).toLocaleString("en-IN")}</td>
                    <td style={{ padding: "6px", color: COLORS.bullish, fontWeight: 600 }}>{s.probability}%</td>
                    <td style={{ padding: "6px", color: COLORS.bullish, fontSize: 11 }}>{s.trend || (s.probability >= 75 ? "Strong Bullish" : "Bullish")}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <button style={{ background: "transparent", border: `1px solid ${COLORS.border}`, color: COLORS.textPrimary, borderRadius: 8, padding: "8px 12px", fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            View all stocks <Icon path={paths.chevronRight} size={14} />
          </button>
        </Card>

        <Card title="AI Option Trade Setup — NIFTY">
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <span style={{ fontSize: 16, fontWeight: 700 }}>{bestTrade.symbol} {bestTrade.strike.toLocaleString("en-IN")} {bestTrade.type}</span>
            <Pill color="#08331F" bg={COLORS.bullish}>BUY</Pill>
          </div>
          <span style={{ fontSize: 12, color: COLORS.textSecondary }}>
            Estimated probability <span style={{ color: COLORS.bullish, fontWeight: 700 }}>{bestTrade.prob}%</span>
          </span>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, fontSize: 12 }}>
            <div><div style={{ color: COLORS.textSecondary }}>Buy range</div><div style={{ fontWeight: 600 }}>₹{bestTrade.buyLow}–{bestTrade.buyHigh}</div></div>
            <div><div style={{ color: COLORS.textSecondary }}>Risk / reward</div><div style={{ fontWeight: 600 }}>{bestTrade.rr}</div></div>
            <div><div style={{ color: COLORS.textSecondary }}>Target 1</div><div style={{ fontWeight: 600, color: COLORS.bullish }}>₹{bestTrade.t1}</div></div>
            <div><div style={{ color: COLORS.textSecondary }}>Target 2</div><div style={{ fontWeight: 600, color: COLORS.bullish }}>₹{bestTrade.t2}</div></div>
            <div><div style={{ color: COLORS.textSecondary }}>Target 3</div><div style={{ fontWeight: 600, color: COLORS.bullish }}>₹{bestTrade.t3}</div></div>
            <div><div style={{ color: COLORS.textSecondary }}>Stop loss</div><div style={{ fontWeight: 600, color: COLORS.bearish }}>₹{bestTrade.sl}</div></div>
          </div>
          <div>
            <div style={{ fontSize: 11, color: COLORS.textSecondary, marginBottom: 4 }}>5 min chart</div>
            <Candles data={candles} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: COLORS.textSecondary, marginBottom: 6 }}>Key factors</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              {bestTrade.reasons.map(r => (
                <div key={r} style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                  <span>{r}</span><Icon path={paths.arrowUp} size={13} color={COLORS.bullish} />
                </div>
              ))}
            </div>
          </div>
          <div style={{ fontSize: 10, color: COLORS.textSecondary, borderTop: `1px solid ${COLORS.border}`, paddingTop: 6 }}>Expiry {bestTrade.expiry}</div>
        </Card>

        <Card title="Option Chain — NIFTY">
          <div style={{ display: "flex", gap: 8, fontSize: 11, fontWeight: 700 }}>
            <div style={{ flex: 1, textAlign: "center", padding: 6, borderRadius: 6, background: "#0F2A20", color: COLORS.bullish }}>CALLS (CE)</div>
            <div style={{ flex: 1, textAlign: "center", padding: 6, borderRadius: 6, background: "#2E1416", color: COLORS.bearish }}>PUTS (PE)</div>
          </div>
          <div style={{ overflowX: "auto" }}>
            <table style={{ fontSize: 11 }}>
              <thead>
                <tr style={{ color: COLORS.textSecondary, textAlign: "center" }}>
                  <th style={{ padding: "4px" }}>OI Chg</th><th style={{ padding: "4px" }}>LTP</th><th style={{ padding: "4px" }}>Prob.</th>
                  <th style={{ padding: "4px", background: "#1B2333" }}>Strike</th>
                  <th style={{ padding: "4px" }}>OI Chg</th><th style={{ padding: "4px" }}>LTP</th><th style={{ padding: "4px" }}>Prob.</th>
                </tr>
              </thead>
              <tbody>
                {OPTION_CHAIN_ROWS.map(r => (
                  <tr key={r.strike} style={{ borderTop: `1px solid ${COLORS.border}`, textAlign: "center" }}>
                    <td style={{ padding: "5px", color: r.callOiChg >= 0 ? COLORS.bullish : COLORS.bearish }}>+{r.callOiChg}%</td>
                    <td style={{ padding: "5px" }}>{r.callLtp}</td><td style={{ padding: "5px" }}>{r.callProb}%</td>
                    <td style={{ padding: "5px", fontWeight: 700, background: r.atm ? "#241B4A" : "transparent" }}>{r.strike.toLocaleString("en-IN")}</td>
                    <td style={{ padding: "5px", color: r.putOiChg >= 0 ? COLORS.bullish : COLORS.bearish }}>+{r.putOiChg}%</td>
                    <td style={{ padding: "5px" }}>{r.putLtp}</td><td style={{ padding: "5px" }}>{r.putProb}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <span style={{ fontSize: 12, color: COLORS.textSecondary }}>Spot: <span style={{ color: COLORS.textPrimary, fontWeight: 600 }}>24,834.85</span> <span style={{ color: COLORS.bullish }}>(+1.02%)</span></span>
            <button style={{ background: COLORS.info, border: "none", color: "#fff", borderRadius: 8, padding: "8px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Full option chain</button>
          </div>
        </Card>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(4, 1fr)", gap: 16 }}>
        <Card title="Market Overview">
          <LineSpark data={overviewSeries} color={COLORS.bullish} height={110} area={true} />
          <div style={{ display: "flex", gap: 6, fontSize: 11 }}>
            {["1D", "1W", "1M", "3M", "1Y"].map((t, i) => (
              <span key={t} style={{ padding: "3px 8px", borderRadius: 6, background: i === 0 ? COLORS.info : "transparent", color: i === 0 ? "#fff" : COLORS.textSecondary }}>{t}</span>
            ))}
          </div>
        </Card>
        <Card title="Sector Performance">
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {SECTOR_PERFORMANCE.map(s => (
              <div key={s.name} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 11 }}>
                <span style={{ width: 56, color: COLORS.textSecondary }}>{s.name}</span>
                <div style={{ flex: 1, height: 6, background: COLORS.border, borderRadius: 3, overflow: "hidden" }}>
                  <div style={{ width: `${Math.min(Math.abs(s.change) * 30, 100)}%`, height: "100%", background: s.change >= 0 ? COLORS.bullish : COLORS.bearish }} />
                </div>
                <span style={{ width: 44, textAlign: "right", color: s.change >= 0 ? COLORS.bullish : COLORS.bearish, fontWeight: 600 }}>{s.change > 0 ? "+" : ""}{s.change}%</span>
              </div>
            ))}
          </div>
        </Card>
        <Card title="AI Prediction Summary">
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <Donut data={AI_PREDICTION} />
            <div style={{ display: "flex", flexDirection: "column", gap: 4, fontSize: 12 }}>
              {AI_PREDICTION.map(e => (
                <div key={e.name} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 4, background: e.color }} />
                  <span style={{ fontWeight: 700 }}>{e.value}%</span><span style={{ color: COLORS.textSecondary }}>{e.name}</span>
                </div>
              ))}
            </div>
          </div>
        </Card>
        <Card title="Market Heatmap">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6 }}>
            {HEATMAP_TILES.map(t => (
              <div key={t.symbol} style={{ background: t.change >= 0 ? "#0F2A20" : "#2E1416", color: t.change >= 0 ? COLORS.bullish : COLORS.bearish, borderRadius: 8, padding: "6px 4px", textAlign: "center" }}>
                <div style={{ fontSize: 10, fontWeight: 700 }}>{t.symbol}</div>
                <div style={{ fontSize: 10 }}>{t.change > 0 ? "+" : ""}{t.change}%</div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      <div style={{ fontSize: 11, color: COLORS.textSecondary, textAlign: "center", padding: "4px 0 12px" }}>{DISCLAIMER}</div>
    </div>
  );
}

function ComingSoon({ label }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: 260, gap: 8, color: COLORS.textSecondary }}>
      <Icon path={paths.brain} size={28} color={COLORS.ai} />
      <div style={{ fontSize: 15, fontWeight: 600, color: COLORS.textPrimary }}>{label}</div>
      <div style={{ fontSize: 12, textAlign: "center", maxWidth: 320 }}>This page is planned for a later build phase. The Dashboard (Phase 1) is complete with mock data.</div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// APP SHELL
// ---------------------------------------------------------------------------
function AITradingEdge() {
  const [active, setActive] = useState("dashboard");
  const [isMobile, setIsMobile] = useState(window.innerWidth < 900);
  const [clock, setClock] = useState(new Date());
  const [authed, setAuthed] = useState(!!getToken());

  useEffect(() => {
    const check = () => setIsMobile(window.innerWidth < 900);
    window.addEventListener("resize", check);
    const t = setInterval(() => setClock(new Date()), 30000);
    return () => { window.removeEventListener("resize", check); clearInterval(t); };
  }, []);

  if (!authed) {
    return <AuthScreen onAuthed={() => setAuthed(true)} />;
  }

  const timeStr = clock.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const activeLabel = (NAV_ITEMS.find(n => n.key === active) || {}).label || "Dashboard";

  function handleLogout() {
    clearToken();
    setAuthed(false);
  }

  return (
    <div style={{ background: COLORS.bg, color: COLORS.textPrimary, minHeight: "100vh" }}>
      <div style={{ height: 64, borderBottom: `1px solid ${COLORS.border}`, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 16px", position: "sticky", top: 0, background: COLORS.bg, zIndex: 10, gap: 12, overflowX: "auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
          <div style={{ width: 28, height: 28, borderRadius: 8, background: COLORS.ai, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon path={paths.brain} size={16} color="#fff" />
          </div>
          {!isMobile && <span style={{ fontWeight: 700, fontSize: 14, whiteSpace: "nowrap" }}>AI TRADING EDGE</span>}
        </div>
        {!isMobile && (
          <div style={{ display: "flex", gap: 20, fontSize: 12 }}>
            {[
              { label: "NIFTY 50", v: "24,834.85", chg: "+1.02%" },
              { label: "BANK NIFTY", v: "53,621.45", chg: "+1.35%" },
              { label: "SENSEX", v: "81,330.56", chg: "+0.92%" },
              { label: "INDIA VIX", v: "14.32", chg: "-2.41%" },
            ].map(idx => (
              <div key={idx.label}>
                <div style={{ color: COLORS.textSecondary, fontSize: 10 }}>{idx.label}</div>
                <div style={{ fontWeight: 700 }}>{idx.v} <span style={{ color: idx.chg.startsWith("+") ? COLORS.bullish : COLORS.bearish, fontWeight: 600 }}>{idx.chg}</span></div>
              </div>
            ))}
          </div>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
          <span style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: COLORS.bullish }}>
            <Icon path={paths.circle} size={8} color={COLORS.bullish} fill={COLORS.bullish} /> Live
          </span>
          {!isMobile && <span style={{ fontSize: 12, color: COLORS.textSecondary }}>{timeStr}</span>}
          <Icon path={paths.sun} size={16} color={COLORS.textSecondary} />
          <Icon path={paths.bell} size={16} color={COLORS.textSecondary} />
          <div onClick={handleLogout} title="Log out" style={{ cursor: "pointer" }}>
            <Icon path={paths.user} size={16} color={COLORS.textSecondary} />
          </div>
        </div>
      </div>

      <div style={{ display: "flex" }}>
        {!isMobile && (
          <div style={{ width: 220, borderRight: `1px solid ${COLORS.border}`, padding: 12, flexShrink: 0, minHeight: "calc(100vh - 64px)" }}>
            {NAV_ITEMS.map(item => {
              const isActive = active === item.key;
              return (
                <div key={item.key} onClick={() => setActive(item.key)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderRadius: 8, marginBottom: 2, cursor: "pointer", fontSize: 13, background: isActive ? COLORS.info : "transparent", color: isActive ? "#fff" : COLORS.textSecondary }}>
                  <Icon path={paths[item.icon]} size={16} />{item.label}
                </div>
              );
            })}
          </div>
        )}
        <div style={{ flex: 1, padding: 20, paddingBottom: isMobile ? 80 : 20, minWidth: 0 }}>
          {active === "dashboard" ? <Dashboard isMobile={isMobile} /> : <ComingSoon label={activeLabel} />}
        </div>
      </div>

      {isMobile && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, height: 64, background: COLORS.card, borderTop: `1px solid ${COLORS.border}`, display: "flex", zIndex: 20 }}>
          {MOBILE_NAV.map(item => {
            const isActive = active === item.key;
            return (
              <div key={item.key} onClick={() => setActive(item.key)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, cursor: "pointer", color: isActive ? COLORS.info : COLORS.textSecondary }}>
                <Icon path={paths[item.icon]} size={18} /><span style={{ fontSize: 10 }}>{item.label}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<AITradingEdge />);
} catch (err) {
  document.getElementById("root").innerHTML =
    '<div style="padding:40px 20px;text-align:center;font-size:14px;color:#EA3943;">App failed to start: ' +
    (err && err.message ? err.message : String(err)) +
    '</div>';
}
</script>
</body>
</html>
