<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trade Map</title>
<style>
  :root {
    --bg: #0B0F0C; --card: #10160F; --border: #1E2A1D;
    --text: #E6EDE6; --text2: #7C8A78;
    --bullish: #00E676; --bearish: #FF3B3B; --ai: #7C5CFC; --info: #2E7D32;
    --call-bg: #0F2818; --call-text: #00E676;
    --put-bg: #2A1414; --put-text: #FF3B3B;
    --strike-bg: #161B22; --atm-bg: #1E2A1D;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.5);
    --sidebar-w: 220px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  table { border-collapse: collapse; width: 100%; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
    box-shadow: var(--shadow);
  }
  .card-title { font-size: 13px; font-weight: 600; letter-spacing: 0.4px; color: var(--text2); }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  button { font-family: inherit; }
  .btn-primary {
    padding: 12px 0; border-radius: 8px; border: none; cursor: pointer;
    background: var(--info); color: #fff; font-weight: 600; font-size: 14px; width: 100%;
  }
  .btn-primary:disabled { opacity: 0.7; cursor: default; }
  .tab-btn {
    flex: 1; padding: 8px 0; border-radius: 6px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; background: transparent; color: var(--text2);
  }
  .tab-btn.active { background: var(--info); color: #fff; }
  .grid { display: grid; gap: 16px; }
  #root { min-height: 100vh; }
  .disclaimer { font-size: 11px; color: var(--text2); text-align: center; padding: 4px 0 12px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; margin-bottom: 2px; cursor: pointer; font-size: 13px; color: var(--text2); }
  .nav-item.active { background: var(--info); color: #fff; }
  .mobile-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--text2); }
  .mobile-nav-item.active { color: var(--info); }

  /* --- slide-in/out sidebar drawer --- */
  .sidebar-drawer {
    position: fixed; top: 0; left: 0; height: 100vh; width: var(--sidebar-w);
    background: var(--card); border-right: 1px solid var(--border); padding: 12px;
    padding-top: 76px; z-index: 40; transform: translateX(-100%);
    transition: transform 0.25s ease; overflow-y: auto;
  }
  .sidebar-drawer.open { transform: translateX(0); box-shadow: 2px 0 12px rgba(16,24,40,0.10); }
  .sidebar-overlay {
    position: fixed; inset: 0; background: rgba(16,20,30,0.35); z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
  .menu-toggle {
    width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; border: 1px solid var(--border); background: var(--card);
    flex-shrink: 0;
  }
  .refresh-btn.spin svg { animation: spin-rotate 0.7s linear; }
  @keyframes spin-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* --- ticker strip --- */
  .ticker-wrap {
    overflow: hidden; white-space: nowrap; background: var(--card);
    border-bottom: 1px solid var(--border); padding: 8px 0; position: sticky; top: 64px; z-index: 9;
  }
  .ticker-track {
    display: inline-flex; gap: 28px; padding-left: 100%;
    animation: ticker-scroll 32s linear infinite;
  }
  .ticker-wrap:hover .ticker-track { animation-play-state: paused; }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }
  .ticker-item { display: inline-flex; align-items: baseline; gap: 6px; font-size: 12px; }
  .ticker-item .tname { font-weight: 700; color: var(--text); }
  .ticker-item .tval { color: var(--text2); }

  /* --- header stat boxes (NIFTY/BANK NIFTY/SENSEX/ADX/RSI etc.) --- */
  .stat-strip {
    display: flex; gap: 8px; overflow-x: auto; flex: 1; min-width: 0;
    scrollbar-width: none; padding: 4px 0;
  }
  .stat-strip::-webkit-scrollbar { display: none; }
  .stat-box {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); min-width: 68px; line-height: 1.15;
  }
  .stat-box .sname { font-size: 9px; font-weight: 700; letter-spacing: 0.3px; color: var(--text2); }
  .stat-box .sval { font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; border-radius: 4px; padding: 0 2px; }
  .stat-box .schg { font-size: 10px; font-weight: 600; white-space: nowrap; }

  /* --- settings / alerts toggle switch --- */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; cursor: pointer; inset: 0; background: var(--border);
    border-radius: 22px; transition: 0.2s;
  }
  .switch-track:before {
    position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
    background: #fff; border-radius: 50%; transition: 0.2s;
  }
  .switch input:checked + .switch-track { background: var(--info); }
  .switch input:checked + .switch-track:before { transform: translateX(18px); }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  .settings-row:first-of-type { border-top: none; }
  .rule-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// BACKEND CONNECTION (the only network calls this page makes)
// ---------------------------------------------------------------------------
const API_BASE = "https://tred-map.onrender.com";
const DISCLAIMER = "Probability is an analytical estimate based on market data and historical patterns. It does not guarantee profit. Trading and options trading involve substantial risk.";

function getToken() { return localStorage.getItem("ai_trading_edge_token"); }
function setToken(t) { localStorage.setItem("ai_trading_edge_token", t); }
function clearToken() { localStorage.removeItem("ai_trading_edge_token"); }

// ---------------------------------------------------------------------------
// WATCHLIST (stored locally on this device)
// ---------------------------------------------------------------------------
const WATCHLIST_KEY = "ai_trading_edge_watchlist";
function getWatchlist() {
  try { return JSON.parse(localStorage.getItem(WATCHLIST_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveWatchlist(list) { localStorage.setItem(WATCHLIST_KEY, JSON.stringify(list)); }
function isWatchlisted(symbol) { return getWatchlist().some(function (w) { return w.symbol === symbol; }); }
function upsertWatchlistItem(item) {
  const list = getWatchlist();
  const idx = list.findIndex(function (w) { return w.symbol === item.symbol; });
  if (idx >= 0) list[idx] = Object.assign({}, list[idx], item);
  else list.push(item);
  saveWatchlist(list);
  return list;
}
function removeWatchlistItem(symbol) {
  const list = getWatchlist().filter(function (w) { return w.symbol !== symbol; });
  saveWatchlist(list);
  return list;
}

// ---------------------------------------------------------------------------
// SETTINGS (stored locally on this device)
// ---------------------------------------------------------------------------
const SETTINGS_KEY = "ai_trading_edge_settings";
const DEFAULT_SETTINGS = {
  default_underlying: "NIFTY",
  alert_probability_threshold: 70,
  desktop_notifications: false,
  compact_header_stats: false,
};
function getSettings() {
  try { return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); }
  catch (e) { return Object.assign({}, DEFAULT_SETTINGS); }
}
function saveSettings(patch) {
  const merged = Object.assign({}, getSettings(), patch);
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(merged));
  return merged;
}

// ---------------------------------------------------------------------------
// ALERT RULES (stored locally on this device; checked client-side against
// live scanner data since the mock backend has no push-alert service yet)
// ---------------------------------------------------------------------------
const ALERT_RULES_KEY = "ai_trading_edge_alert_rules";
function getAlertRules() {
  try { return JSON.parse(localStorage.getItem(ALERT_RULES_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveAlertRules(rules) { localStorage.setItem(ALERT_RULES_KEY, JSON.stringify(rules)); }
function addAlertRule(rule) {
  const rules = getAlertRules();
  rules.push(Object.assign({ id: String(Date.now()) }, rule));
  saveAlertRules(rules);
  return rules;
}
function removeAlertRule(id) {
  const rules = getAlertRules().filter(function (r) { return r.id !== id; });
  saveAlertRules(rules);
  return rules;
}
function notifyIfEnabled(title, body) {
  if (!getSettings().desktop_notifications) return;
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  try { new Notification(title, { body: body }); } catch (e) { /* ignore */ }
}

async function apiFetch(path, options) {
  options = options || {};
  const token = getToken();
  const headers = Object.assign({}, options.headers || {});
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API_BASE + path, Object.assign({}, options, { headers: headers }));
  if (!res.ok) {
    const text = await res.text().catch(function () { return ""; });
    throw new Error("API " + path + " failed (" + res.status + "): " + text);
  }
  return res.json();
}

async function registerUser(email, password) {
  const res = await fetch(API_BASE + "/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password }),
  });
  if (!res.ok) {
    const j = await res.json().catch(function () { return {}; });
    throw new Error(j.detail || "Registration failed");
  }
  return res.json();
}

async function loginUser(email, password) {
  const body = new URLSearchParams();
  body.append("username", email);
  body.append("password", password);
  const res = await fetch(API_BASE + "/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body.toString(),
  });
  if (!res.ok) {
    const j = await res.json().catch(function () { return {}; });
    throw new Error(j.detail || "Login failed");
  }
  return res.json();
}

// ---------------------------------------------------------------------------
// SMALL DOM HELPERS (no framework)
// ---------------------------------------------------------------------------
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) {
    if (k === "class") node.className = attrs[k];
    else if (k === "style") node.setAttribute("style", attrs[k]);
    else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function (c) {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function fmtINR(n) { return Number(n).toLocaleString("en-IN"); }

function starSvg(filled) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", "16"); svg.setAttribute("height", "16");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", filled ? "#F59E0B" : "none");
  svg.setAttribute("stroke", filled ? "#F59E0B" : "var(--text2)");
  svg.setAttribute("stroke-width", "2"); svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
  svg.innerHTML = '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>';
  return svg;
}
function buildWatchStar(item) {
  const wrap = el("span", { style: "cursor:pointer;display:inline-flex;", title: "Toggle watchlist" });
  function paint() { clear(wrap); wrap.appendChild(starSvg(isWatchlisted(item.symbol))); }
  paint();
  wrap.addEventListener("click", function (e) {
    e.stopPropagation();
    if (isWatchlisted(item.symbol)) removeWatchlistItem(item.symbol);
    else upsertWatchlistItem(Object.assign({ added_at: Date.now() }, item));
    paint();
  });
  return wrap;
}

// ---------------------------------------------------------------------------
// ICONS (tiny inline SVGs)
// ---------------------------------------------------------------------------

  size = size || 16; color = color || "currentColor";
  const paths = {
    home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
    scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>',
    trendUp: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
    bar: '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
    brain: '<path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>',
    star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    wallet: '<path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>',
    bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
    history: '<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    circle: '<circle cx="12" cy="12" r="10"/>',
    menu: '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>',
    grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.13-3.36L23 10"/><path d="M20.49 15a9 9 0 01-14.13 3.36L1 14"/>',
  };
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", size); svg.setAttribute("height", size);
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", color); svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
  svg.innerHTML = paths[name] || "";
  return svg;
}

// ---------------------------------------------------------------------------
// AUTH SCREEN
// ---------------------------------------------------------------------------
function renderAuthScreen(root, onAuthed) {
  clear(root);
  let mode = "login";

  const wrap = el("div", { style: "min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;" });
  const box = el("div", { style: "width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;" });

  const header = el("div", { style: "display:flex;align-items:center;gap:8px;margin-bottom:20px;justify-content:center;" }, [
    el("div", { style: "width:32px;height:32px;border-radius:8px;background:var(--ai);display:flex;align-items:center;justify-content:center;" }, [icon("brain", 18, "#fff")]),
    el("span", { style: "font-weight:700;font-size:16px;" }, ["TRADE MAP"]),
  ]);

  const loginTab = el("button", { class: "tab-btn active", type: "button" }, ["Log in"]);
  const registerTab = el("button", { class: "tab-btn", type: "button" }, ["Register"]);
  const tabRow = el("div", { style: "display:flex;gap:4px;margin-bottom:20px;background:var(--bg);border-radius:8px;padding:4px;" }, [loginTab, registerTab]);

  const emailInput = el("input", { type: "email", placeholder: "you@example.com" });
  const passwordInput = el("input", { type: "password", placeholder: "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" });
  const errorBox = el("div", { style: "font-size:12px;color:var(--bearish);display:none;" });
  const wakingBox = el("div", { style: "font-size:11px;color:var(--text2);display:none;" }, ["Server is waking up (free tier) \u2014 this can take up to a minute on the first request\u2026"]);
  const submitBtn = el("button", { class: "btn-primary", type: "submit" }, ["Log in"]);

  function setMode(m) {
    mode = m;
    loginTab.className = "tab-btn" + (m === "login" ? " active" : "");
    registerTab.className = "tab-btn" + (m === "register" ? " active" : "");
    submitBtn.textContent = m === "login" ? "Log in" : "Create account";
    errorBox.style.display = "none";
  }
  loginTab.addEventListener("click", function () { setMode("login"); });
  registerTab.addEventListener("click", function () { setMode("register"); });

  const form = el("form", { style: "display:flex;flex-direction:column;gap:12px;" }, [
    el("div", {}, [el("label", { style: "font-size:12px;color:var(--text2);display:block;margin-bottom:4px;" }, ["Email"]), emailInput]),
    el("div", {}, [el("label", { style: "font-size:12px;color:var(--text2);display:block;margin-bottom:4px;" }, ["Password"]), passwordInput]),
    errorBox, wakingBox, submitBtn,
  ]);

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorBox.style.display = "none";
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      errorBox.textContent = "Enter both email and password.";
      errorBox.style.display = "block";
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = "Please wait\u2026";
    const wakeTimer = setTimeout(function () { wakingBox.style.display = "block"; }, 4000);
    try {
      const data = mode === "login" ? await loginUser(email, password) : await registerUser(email, password);
      setToken(data.access_token);
      onAuthed();
    } catch (err) {
      errorBox.textContent = err.message || "Something went wrong.";
      errorBox.style.display = "block";
    } finally {
      clearTimeout(wakeTimer);
      wakingBox.style.display = "none";
      submitBtn.disabled = false;
      submitBtn.textContent = mode === "login" ? "Log in" : "Create account";
    }
  });

  const footer = el("div", { style: "font-size:10px;color:var(--text2);text-align:center;margin-top:16px;" }, [DISCLAIMER]);

  box.appendChild(header); box.appendChild(tabRow); box.appendChild(form); box.appendChild(footer);
  wrap.appendChild(box);
  root.appendChild(wrap);
}

function buildTradeCard(trade, isBest, symbolOverride) {
  const badgeColor = trade.option_type === "CE" ? "var(--bullish)" : "var(--bearish)";
  const card = el("div", { class: "card" }, [
    el("div", { style: "display:flex;align-items:center;justify-content:space-between;" }, [
      el("span", { style: "font-size:" + (isBest ? "18px" : "14px") + ";font-weight:700;" }, [fmtINR(trade.strike) + " " + trade.option_type]),
      el("span", { style: "font-size:11px;font-weight:600;color:#fff;background:" + badgeColor + ";padding:3px 8px;border-radius:6px;" }, [trade.option_type === "CE" ? "BUY (CALL)" : "BUY (PUT)"]),
    ]),
    el("div", { style: "font-size:12px;color:var(--text2);" }, ["Estimated probability ", el("span", { style: "font-weight:700;color:var(--bullish);" }, [trade.probability + "%"])]),
  ]);
  const grid = el("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;" });
  [["Buy range", "\u20B9" + trade.buy_range_low + "\u2013" + trade.buy_range_high],
   ["Risk / reward", "1 : " + trade.risk_reward],
   ["Target 1", "\u20B9" + trade.target_1], ["Target 2", "\u20B9" + trade.target_2],
   ["Target 3", "\u20B9" + trade.target_3], ["Stop loss", "\u20B9" + trade.stop_loss]].forEach(function (row) {
    grid.appendChild(el("div", {}, [el("div", { style: "color:var(--text2);" }, [row[0]]), el("div", { style: "font-weight:600;" }, [row[1]])]));
  });
  card.appendChild(grid);
  if (isBest) {
    card.appendChild(el("div", { style: "font-size:11px;color:var(--text2);margin-top:4px;" }, ["Why this trade?"]));
    const reasonsList = el("ul", { style: "margin:0;padding-left:18px;font-size:12px;color:var(--text2);" });
    (trade.reasons || []).forEach(function (r) { reasonsList.appendChild(el("li", {}, [r])); });
    card.appendChild(reasonsList);
    card.appendChild(el("div", { style: "font-size:11px;color:var(--text2);margin-top:8px;" }, ["What can invalidate this?"]));
    const invList = el("ul", { style: "margin:0;padding-left:18px;font-size:12px;color:var(--bearish);" });
    (trade.invalidation || []).forEach(function (r) { invList.appendChild(el("li", {}, [r])); });
    card.appendChild(invList);

    const symbol = symbolOverride || trade.symbol;
    if (symbol) {
      const logBtn = el("button", { class: "btn-primary", type: "button", style: "width:auto;padding:8px 16px;background:var(--ai);margin-top:8px;" }, ["+ Log This Trade"]);
      const logMsg = el("div", { style: "font-size:11px;color:var(--text2);margin-top:4px;" });
      logBtn.addEventListener("click", function () {
        logBtn.disabled = true;
        logBtn.textContent = "Logging\u2026";
        const direction = trade.option_type === "CE" ? "bullish" : "bearish";
        const entryPrice = trade.buy_range_low != null ? trade.buy_range_low : trade.buy_range_high;
        const qs = new URLSearchParams({
          symbol: symbol,
          instrument_type: trade.option_type || "OPTION",
          direction: direction,
          entry_price: String(entryPrice),
          target_1: String(trade.target_1),
          stop_loss: String(trade.stop_loss),
          predicted_probability: String(trade.probability),
        });
        apiFetch("/signals/log?" + qs.toString(), { method: "POST" }).then(function () {
          logBtn.textContent = "\u2713 Logged";
          logMsg.style.color = "var(--bullish)";
          logMsg.textContent = "Saved to your Signal Log \u2014 check the Alerts page.";
        }).catch(function () {
          logBtn.disabled = false;
          logBtn.textContent = "+ Log This Trade";
          logMsg.style.color = "var(--bearish)";
          logMsg.textContent = "Could not save this signal. Try again.";
        });
      });
      card.appendChild(logBtn);
      card.appendChild(logMsg);
    }
  }
  return card;
}

function verdictColor(verdict) {

}

function zoneStrip(cells, minWidth) {
  const wrap = el("div", { style: "overflow-x:auto;" });
  const row = el("div", { style: "display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;min-width:" + (minWidth || 560) + "px;" });
  cells.forEach(function (c, idx) {
    // c = [label, value, colorVar(optional), highlight(optional bool)]
    row.appendChild(el("div", {
      style: "flex:1;padding:8px 6px;text-align:center;" + (idx > 0 ? "border-left:1px solid var(--border);" : "") + (c[3] ? "background:var(--call-bg);" : "")
    }, [
      el("div", { style: "font-size:9px;color:var(--text2);font-weight:700;letter-spacing:0.3px;" }, [c[0]]),
      el("div", { style: "font-size:12px;font-weight:700;color:" + (c[2] || "var(--text)") + ";white-space:nowrap;" }, [String(c[1])]),
    ]));
  });
  wrap.appendChild(row);
  return wrap;
}

function nearestLabel(spot, levels) {
  // levels: [[label, value], ...] -> returns the label whose value is closest to spot
  let best = null, bestDiff = Infinity;
  levels.forEach(function (l) {
    const diff = Math.abs(l[1] - spot);
    if (diff < bestDiff) { bestDiff = diff; best = l[0]; }
  });
  return best;
}

function zoneTitle(indexName) {
  const nice = indexName === "BANKNIFTY" ? "BANK NIFTY" : indexName;
  return nice + " ZONE";
}

function buildNiftyZoneCard(z, spot) {
  const card = el("div", { class: "card" }, [el("span", { class: "card-title" }, [zoneTitle(z.index)])]);

  const rangeCells = [
    ["INDEX", z.index], ["PDC", fmtINR(z.pdc)], ["OPEN", fmtINR(z.open), z.open >= z.pdc ? "var(--bullish)" : "var(--bearish)"],
    ["LOW", fmtINR(z.low), "var(--bearish)"], ["LOW -30", fmtINR(z.low_30), "var(--bearish)"],
    ["HIGH", fmtINR(z.high), "var(--bullish)"], ["HIGH +30", fmtINR(z.high_30), "var(--bullish)"],
    ["AVG", fmtINR(z.avg)], ["ZONE", fmtINR(z.zone.low) + "-" + fmtINR(z.zone.high), "var(--info)"],
  ];
  const nearRange = nearestLabel(spot, [["LOW", z.low], ["LOW -30", z.low_30], ["HIGH", z.high], ["HIGH +30", z.high_30], ["AVG", z.avg]]);
  rangeCells.forEach(function (c) { if (c[0] === nearRange) c[3] = true; });
  card.appendChild(zoneStrip(rangeCells, 640));

  const pivotCells = [
    ["S4", fmtINR(z.supports.S4), "var(--bullish)"], ["S3", fmtINR(z.supports.S3), "var(--bullish)"],
    ["S2", fmtINR(z.supports.S2), "var(--bullish)"], ["S1", fmtINR(z.supports.S1), "var(--bullish)"],
    ["PC", fmtINR(z.pivot_close), "var(--info)"],
    ["R1", fmtINR(z.resistances.R1), "var(--bearish)"], ["R2", fmtINR(z.resistances.R2), "var(--bearish)"],
    ["R3", fmtINR(z.resistances.R3), "var(--bearish)"], ["R4", fmtINR(z.resistances.R4), "var(--bearish)"],
  ];
  const nearPivot = nearestLabel(spot, [
    ["S4", z.supports.S4], ["S3", z.supports.S3], ["S2", z.supports.S2], ["S1", z.supports.S1], ["PC", z.pivot_close],
    ["R1", z.resistances.R1], ["R2", z.resistances.R2], ["R3", z.resistances.R3], ["R4", z.resistances.R4],
  ]);
  pivotCells.forEach(function (c) { if (c[0] === nearPivot) c[3] = true; });
  card.appendChild(zoneStrip(pivotCells, 640));

  return card;
}

function buildMarketBreadthPanel(title, data, timestamp) {

    el("div", { style: "display:flex;align-items:center;justify-content:space-between;" }, [
      el("span", { class: "card-title" }, [title]),
      el("span", { style: "font-size:10px;color:var(--text2);" }, [timestamp]),
    ]),
  ]);
  const table = el("table", { style: "font-size:12px;" });
  const thead = el("thead", {}, [el("tr", { style: "color:var(--text2);font-size:11px;text-align:left;" }, [
    el("th", { style: "padding:4px 6px;" }, ["MARKET"]),
    el("th", { style: "padding:4px 6px;text-align:center;" }, ["ADV"]),
    el("th", { style: "padding:4px 6px;text-align:center;" }, ["DEC"]),
    el("th", { style: "padding:4px 6px;text-align:center;" }, ["UNCH"]),
  ])]);
  const tbody = el("tbody");
  [["NIFTY 50", data.NIFTY_50], ["NIFTY BANK", data.NIFTY_BANK], ["FNO", data.FNO]].forEach(function (row) {
    const label = row[0], d = row[1];
    tbody.appendChild(el("tr", { style: "border-top:1px solid var(--border);" }, [
      el("td", { style: "padding:5px 6px;font-weight:600;" }, [label]),
      el("td", { style: "padding:5px 6px;text-align:center;color:var(--bullish);font-weight:700;" }, [String(d.advances)]),
      el("td", { style: "padding:5px 6px;text-align:center;color:var(--bearish);font-weight:700;" }, [String(d.declines)]),
      el("td", { style: "padding:5px 6px;text-align:center;color:var(--text2);" }, [String(d.unchanged)]),
    ]));

  table.appendChild(thead); table.appendChild(tbody);
  card.appendChild(table);

function buildMarketBreadthRow(data, isMobile) {
  const grid = el("div", { class: "grid", style: "grid-template-columns:" + (isMobile ? "1fr" : "1fr 1fr") + ";" });
  grid.appendChild(buildMarketBreadthPanel("PRE-OPEN MARKET DATA", data.pre_open, data.timestamp));
  grid.appendChild(buildMarketBreadthPanel("LIVE MARKET DATA", data.live, data.timestamp));
  return grid;
}

function buildOptionChainPageContent(isMobile, defaultSegment, allowSegmentSwitch) {
  const wrap = el("div", { style: "display:flex;flex-direction:column;gap:16px;" });
  let segment = defaultSegment || "index"; // "index" | "stock"
  if (allowSegmentSwitch === false) segment = "index"; // Nifty Data tab: always Index, no Stock F&O switch
  let hideChain = false;
  const tradeExpiry = "2026-09-25";

  const zoneWrap = el("div");
  const zoneSlot = el("div", { class: "card" }, [
    el("span", { class: "card-title" }, ["Loading\u2026"]),
    el("div", { style: "font-size:12px;color:var(--text2);" }, ["Loading\u2026"]),
  ]);
  zoneWrap.appendChild(zoneSlot);
  const breadthSlot = el("div", { style: "font-size:12px;color:var(--text2);" }, ["Loading market breadth\u2026"]);
  const indexPanels = el("div", { style: "display:flex;flex-direction:column;gap:16px;" }, [zoneWrap, breadthSlot]);

  const segIndexBtn = el("button", { class: "tab-btn" + (segment === "index" ? " active" : "") }, ["Index"]);
  const segStockBtn = el("button", { class: "tab-btn" + (segment === "stock" ? " active" : "") }, ["Stock F&O"]);
  const segRow = el("div", { style: "display:flex;gap:8px;background:var(--bg);border-radius:8px;padding:4px;" }, [segIndexBtn, segStockBtn]);

  const controls = el("div", { class: "card" }, [
    el("span", { class: "card-title" }, ["Option Chain Settings"]),
  ]);
  if (allowSegmentSwitch !== false) controls.appendChild(segRow);
  const hideChainToggle = buildSettingsToggleRow(
    "Hide option chain table",
    "Keeps the Trade Map box, hides the full CE/PE strike table",
    hideChain,
    function (checked) {
      hideChain = checked;
      tableSlot.style.display = hideChain ? "none" : "";
    }
  );
  controls.appendChild(hideChainToggle);
  const underlyingSelect = el("select", { style: "width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;" }, [
    el("option", { value: "NIFTY" }, ["NIFTY"]),
    el("option", { value: "BANKNIFTY" }, ["BANK NIFTY"]),
    el("option", { value: "SENSEX" }, ["SENSEX"]),
  ]);
  underlyingSelect.value = getSettings().default_underlying;
  const indexSelectRow = el("div", { style: "display:flex;gap:10px;align-items:center;" }, [
    el("span", { style: "font-size:12px;color:var(--text2);" }, ["Underlying:"]), underlyingSelect,
  ]);
  const stockSelect = el("select", { style: "width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;" }, [
    el("option", {}, ["Loading stocks\u2026"]),
  ]);
  const stockSearchInput = el("input", { type: "text", placeholder: "Or type any symbol e.g. RELIANCE", style: "flex:1;" });
  const stockSearchBtn = el("button", { class: "btn-primary", type: "button", style: "width:auto;padding:8px 16px;white-space:nowrap;" }, ["Go"]);
  const stockSelectRow = el("div", { style: "display:none;flex-direction:column;gap:8px;" }, [
    el("div", { style: "display:flex;gap:10px;align-items:center;" }, [
      el("span", { style: "font-size:12px;color:var(--text2);" }, ["Stock:"]), stockSelect,
    ]),
    el("div", { style: "display:flex;gap:8px;align-items:stretch;" }, [stockSearchInput, stockSearchBtn]),
  ]);
  controls.appendChild(indexSelectRow);
  controls.appendChild(stockSelectRow);
  apiFetch("/fno/stocks").then(function (data) {
    clear(stockSelect);
    (data.stocks || []).forEach(function (sym) { stockSelect.appendChild(el("option", { value: sym }, [sym])); });
  }).catch(function () {
    clear(stockSelect);
    stockSelect.appendChild(el("option", {}, ["Could not load stock list"]));
  });

  const spotLine = el("div", { style: "font-size:12px;color:var(--text2);" }, ["Loading\u2026"]);
  const tableSlot = el("div");
  const bestTradeSlot = el("div", { class: "card" }, [
    el("span", { class: "card-title" }, ["Trade Map"]),
    el("div", { style: "font-size:12px;color:var(--text2);" }, ["Loading\u2026"]),
  ]);

  wrap.appendChild(controls);
  wrap.appendChild(indexPanels);
  wrap.appendChild(spotLine);
  wrap.appendChild(tableSlot);
  wrap.appendChild(bestTradeSlot);
  wrap.appendChild(el("div", { class: "disclaimer" }, [DISCLAIMER]));

  function currentUnderlying() {
    if (segment !== "index" && stockSearchInput.value.trim()) return stockSearchInput.value.trim().toUpperCase();
    return segment === "index" ? underlyingSelect.value : stockSelect.value;
  }

  function loadZone() {
    if (segment !== "index") return;
    clear(zoneWrap);
    zoneWrap.appendChild(el("div", { class: "card" }, [
      el("span", { class: "card-title" }, [zoneTitle(underlyingSelect.value)]),
      el("div", { style: "font-size:12px;color:var(--text2);" }, ["Loading\u2026"]),
    ]));
    apiFetch("/dashboard/nifty-zone?underlying=" + encodeURIComponent(underlyingSelect.value)).then(function (z) {
      clear(zoneWrap);
      zoneWrap.appendChild(buildNiftyZoneCard(z, (z.high + z.low) / 2));
    }).catch(function () {
      clear(zoneWrap);
      zoneWrap.appendChild(el("div", { class: "card" }, [
        el("span", { class: "card-title" }, [zoneTitle(underlyingSelect.value)]),
        el("div", { style: "font-size:12px;color:var(--bearish);" }, ["Could not load zone data from the backend."]),
      ]));
    });
  }
  apiFetch("/dashboard/market-breadth").then(function (data) {
    breadthSlot.replaceWith(buildMarketBreadthRow(data, isMobile));
  }).catch(function () {
    breadthSlot.textContent = "Could not load market breadth from the backend.";
  });
  loadZone();

  function load() {
    const underlying = currentUnderlying();
    if (!underlying) return;
    clear(tableSlot);
    spotLine.textContent = "Loading\u2026";
    apiFetch("/options/chain?underlying=" + encodeURIComponent(underlying)).then(function (data) {
      spotLine.innerHTML = "";
      spotLine.appendChild(el("span", {}, ["Spot: "]));
      spotLine.appendChild(el("span", { style: "color:var(--text);font-weight:700;" }, [fmtINR(data.spot)]));
      spotLine.appendChild(el("span", {}, [" \u00b7 Expiry: " + data.expiry]));
      tableSlot.appendChild(buildFullOptionChainTable(data));
      tableSlot.style.display = hideChain ? "none" : "";
    }).catch(function () {
      spotLine.textContent = "Could not load option chain from the backend.";
    });
  }

  // After the option chain OI/indicator analysis, pick whichever side (CALL
  // or PUT) the engine currently favors - the one with the higher
  // probability - and show just that one as the actionable entry/target/SL
  // box. This stays visible even when "Hide option chain table" is on.
  function loadBestTrade() {
    const underlying = currentUnderlying();
    if (!underlying) return;
    clear(bestTradeSlot);
    bestTradeSlot.appendChild(el("span", { class: "card-title" }, ["Trade Map"]));
    bestTradeSlot.appendChild(el("div", { style: "font-size:12px;color:var(--text2);" }, ["Loading\u2026"]));
    apiFetch("/options/best-setup?underlying=" + encodeURIComponent(underlying) + "&expiry=" + encodeURIComponent(tradeExpiry)).then(function (data) {
      const favored = data.best_ce.probability >= data.best_pe.probability ? data.best_ce : data.best_pe;
      const other = favored === data.best_ce ? data.best_pe : data.best_ce;
      clear(bestTradeSlot);
      bestTradeSlot.appendChild(el("span", { class: "card-title" }, ["Trade Map \u2014 " + underlying]));
      bestTradeSlot.appendChild(el("div", {
        style: "font-size:11px;color:var(--text2);margin:2px 0 8px;",
      }, [
        "Option chain OI + indicator analysis currently favors " +
          (favored.option_type === "CE" ? "CALL" : "PUT") + " (" + favored.probability +
          "% probability) over " + (other.option_type === "CE" ? "CALL" : "PUT") +
          " (" + other.probability + "%).",
      ]));
      bestTradeSlot.appendChild(buildTradeLineBox(favored, underlying));
    }).catch(function () {
      clear(bestTradeSlot);
      bestTradeSlot.appendChild(el("span", { class: "card-title" }, ["Trade Map"]));
      bestTradeSlot.appendChild(el("div", { style: "font-size:12px;color:var(--bearish);" }, ["Could not load the favored trade from the backend."]));
    });
  }

  function setSegment(next) {
    segment = next;
    segIndexBtn.className = "tab-btn" + (segment === "index" ? " active" : "");
    segStockBtn.className = "tab-btn" + (segment === "stock" ? " active" : "");
    indexSelectRow.style.display = segment === "index" ? "flex" : "none";
    stockSelectRow.style.display = segment === "stock" ? "flex" : "none";
    indexPanels.style.display = segment === "index" ? "flex" : "none";
    load();
    loadBestTrade();
    loadZone();
  }
  segIndexBtn.addEventListener("click", function () { setSegment("index"); });
  segStockBtn.addEventListener("click", function () { setSegment("stock"); });
  underlyingSelect.addEventListener("change", function () { load(); loadBestTrade(); loadZone(); });
  stockSelect.addEventListener("change", function () { stockSearchInput.value = ""; load(); loadBestTrade(); });
  stockSearchBtn.addEventListener("click", function () { load(); loadBestTrade(); });
  stockSearchInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { load(); loadBestTrade(); } });
  indexSelectRow.style.display = segment === "index" ? "flex" : "none";
  stockSelectRow.style.display = segment === "stock" ? "flex" : "none";
  indexPanels.style.display = segment === "index" ? "flex" : "none";
  load();
  loadBestTrade();

  return wrap;
}

function biasRowStyle(bias) {
  if (bias === "CALL BUY") return "background:rgba(14,159,110,0.07);";
  if (bias === "PUT BUY") return "background:rgba(224,36,36,0.07);";
  return "background:rgba(245,158,11,0.08);"; // MIXED OI
}
function biasBadgeColor(signal) {
  return signal === "CALL BUY" ? "var(--bullish)" : (signal === "PUT BUY" ? "var(--bearish)" : "var(--text2)");
}

function oiChgCell(entry) {
  const color = entry.oi_change_value >= 0 ? "var(--bullish)" : "var(--bearish)";
  return el("td", { style: "padding:4px 2px;text-align:center;" }, [
    el("div", { style: "font-weight:700;color:" + color + ";white-space:nowrap;" }, [(entry.oi_change_value >= 0 ? "+" : "") + entry.oi_change_fmt]),
    el("div", { style: "font-size:9px;color:var(--text2);white-space:nowrap;" }, ["(" + entry.oi_change_multiplier + "x)"]),
  ]);
}

function buildOiBiasStrip(overallBias, timeframes) {
  const cells = [["OI", overallBias]].concat(Object.keys(timeframes).filter(function (k) { return k !== "OI"; }).map(function (k) { return [k, timeframes[k]]; }));
  const wrap = el("div", { style: "overflow-x:auto;" });
  const row = el("div", { style: "display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;min-width:520px;" });
  cells.forEach(function (c, idx) {
    const bull = c[1] === "BULLISH";
    row.appendChild(el("div", {
      style: "flex:1;padding:7px 4px;text-align:center;" + (idx > 0 ? "border-left:1px solid var(--border);" : "") + "background:" + (bull ? "var(--call-bg)" : "var(--put-bg)") + ";"
    }, [
      el("div", { style: "font-size:9px;color:var(--text2);font-weight:700;" }, [c[0] + ":"]),
      el("div", { style: "font-size:11px;font-weight:700;color:" + (bull ? "var(--bullish)" : "var(--bearish)") + ";" }, [c[1]]),
    ]));
  });
  wrap.appendChild(row);
  return wrap;
}

function buildFullOptionChainTable(data) {
  const card = el("div", { class: "card" }, [el("span", { class: "card-title" }, ["Full Option Chain \u2014 " + data.underlying])]);
  card.appendChild(buildOiBiasStrip(data.overall_oi_bias, data.timeframe_oi_bias));
  const header = el("div", { style: "display:flex;gap:8px;font-size:11px;font-weight:700;" }, [
    el("div", { style: "flex:1;text-align:center;padding:6px;border-radius:6px;background:var(--call-bg);color:var(--bullish);" }, ["CALLS (CE)"]),
    el("div", { style: "flex:1;text-align:center;padding:6px;border-radius:6px;background:var(--put-bg);color:var(--bearish);" }, ["PUTS (PE)"]),
  ]);
  const table = el("table", { style: "font-size:10px;" });
  // "oiChg" is a special column rendered via oiChgCell(); the rest are plain accessors.
  const COLUMNS = [
    ["OI Chg", "oiChg"], ["OI", function (o) { return o.oi_fmt; }], ["Vol", function (o) { return fmtINR(o.volume); }],
    ["IV", function (o) { return o.iv; }], ["Delta", function (o) { return o.delta; }],
    ["Gamma", function (o) { return o.gamma; }], ["Theta", function (o) { return o.theta; }], ["Vega", function (o) { return o.vega; }],
    ["LTP", function (o) { return o.ltp; }],
  ];
  const ceCols = COLUMNS;
  const peCols = COLUMNS.slice().reverse();
  const theadRow = el("tr", { style: "color:var(--text2);text-align:center;" });
  ceCols.forEach(function (c) { theadRow.appendChild(el("th", { style: "padding:3px;" }, [c[0]])); });
  theadRow.appendChild(el("th", { style: "padding:3px;background:var(--strike-bg);" }, ["Strike"]));
  peCols.forEach(function (c) { theadRow.appendChild(el("th", { style: "padding:3px;" }, [c[0]])); });
  theadRow.appendChild(el("th", { style: "padding:3px;" }, ["Bias"]));
  theadRow.appendChild(el("th", { style: "padding:3px;" }, ["Final Signal"]));
  const thead = el("thead", {}, [theadRow]);

  const tbody = el("tbody");
  const spot = data.spot;
  for (let i = 0; i < data.calls.length; i++) {
    const c = data.calls[i], p = data.puts[i];
    const isAtm = Math.abs(c.strike - spot) === Math.min.apply(null, data.calls.map(function (x) { return Math.abs(x.strike - spot); }));
    const tr = el("tr", { style: "border-top:1px solid var(--border);text-align:center;" + biasRowStyle(c.bias) });
    ceCols.forEach(function (col) {
      if (col[1] === "oiChg") { tr.appendChild(oiChgCell(c)); return; }
      tr.appendChild(el("td", { style: "padding:4px 2px;" }, [String(col[1](c))]));
    });
    tr.appendChild(el("td", { style: "padding:4px 2px;font-weight:700;background:" + (isAtm ? "var(--atm-bg)" : "transparent") + ";" }, [fmtINR(c.strike)]));
    peCols.forEach(function (col) {
      if (col[1] === "oiChg") { tr.appendChild(oiChgCell(p)); return; }
      tr.appendChild(el("td", { style: "padding:4px 2px;" }, [String(col[1](p))]));
    });
    tr.appendChild(el("td", { style: "padding:4px 3px;font-size:9px;font-weight:700;color:var(--text2);" }, [c.bias]));
    tr.appendChild(el("td", { style: "padding:4px 3px;font-size:9px;font-weight:700;color:" + biasBadgeColor(c.final_signal) + ";" }, [c.final_signal]));
    tbody.appendChild(tr);
  }
  table.appendChild(thead); table.appendChild(tbody);
  card.appendChild(header);
  card.appendChild(el("div", { style: "overflow-x:auto;" }, [table]));
  card.appendChild(el("div", { style: "font-size:10px;color:var(--text2);" }, ["BIAS / FINAL SIGNAL is computed from real OI value added by calls vs. puts at each strike \u2014 indicator/AI scoring is layered on afterwards, not before."]));
  return card;
}

function heatmapTile(symbol, ltp, changePct) {
  const up = changePct >= 0;
  const mag = Math.min(Math.abs(changePct) / 3, 1); // 0..1 intensity vs a 3% move
  const bg = up
    ? "rgba(14,159,110," + (0.12 + mag * 0.55) + ")"
    : "rgba(224,36,36," + (0.12 + mag * 0.55) + ")";
  return el("div", { style: "border-radius:8px;padding:10px 8px;background:" + bg + ";display:flex;flex-direction:column;gap:4px;min-width:0;" }, [
    el("div", { style: "font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" }, [symbol]),
    el("div", { style: "font-size:11px;color:var(--text2);" }, ["\u20B9" + fmtINR(ltp)]),
    el("div", { style: "font-size:12px;font-weight:700;color:" + (up ? "var(--bullish)" : "var(--bearish)") + ";" }, [(up ? "+" : "") + changePct + "%"]),
  ]);
}

function buildHeatmapGrid(stocks, isMobile) {
  const grid = el("div", { style: "display:grid;grid-template-columns:repeat(" + (isMobile ? 3 : 6) + ",1fr);gap:8px;" });
  stocks.forEach(function (s) {
    grid.appendChild(heatmapTile(s.symbol || s.stock_symbol, s.ltp, s.change_pct !== undefined ? s.change_pct : (s.probability ? s.probability - 75 : 0)));
  });
  return grid;
}

  const card = el("div", { class: "card" }, [

    el("div", { style: "font-size:12px;color:var(--text2);" }, ["Loading heatmap\u2026"]),
  ]);
  wrap.appendChild(searchCard);
  wrap.appendChild(card);
  wrap.appendChild(el("div", { class: "disclaimer" }, [DISCLAIMER]));

  let allStocks = [];

  function renderGrid(list) {
    clear(card);
    card.appendChild(el("span", { class: "card-title" }, ["Stock Heatmap \u2014 by day\u2019s change %"]));
    if (list.length === 0) {
      card.appendChild(el("div", { style: "font-size:12px;color:var(--text2);" }, ["No matching stock found."]));
    } else {
      card.appendChild(buildHeatmapGrid(list, isMobile));
    }
  }

  function loadAll() {
    return Promise.all([
      apiFetch("/dashboard/top-bullish").catch(function () { return { stocks: FALLBACK_STOCKS }; }),
      apiFetch("/dashboard/top-bearish").catch(function () { return { stocks: [] }; }),
    ]).then(function (results) {
      allStocks = [].concat(results[0].stocks || [], results[1].stocks || []);
      renderGrid(allStocks);
    }).catch(function () {
      clear(card);
      card.appendChild(el("span", { class: "card-title" }, ["Stock Heatmap \u2014 by day\u2019s change %"]));
      card.appendChild(el("div", { style: "font-size:12px;color:var(--bearish);" }, ["Could not load heatmap data from the backend."]));
    });
  }

  function runSearch() {
    const q = searchInput.value.trim().toUpperCase();
    searchMsg.textContent = "";
    if (!q) { renderGrid(allStocks); return; }
    const matches = allStocks.filter(function (s) { return (s.symbol || "").indexOf(q) !== -1; });
    if (matches.length > 0) { renderGrid(matches); return; }
    // Not in the currently loaded lists - look it up directly so ANY
    // symbol can be searched, not just the top-10 bullish/bearish picks.
    searchMsg.textContent = "Looking up " + q + "\u2026";
    apiFetch("/stocks/lookup?symbol=" + encodeURIComponent(q)).then(function (data) {
      searchMsg.textContent = "";
      renderGrid([data]);
    }).catch(function () {
      searchMsg.textContent = "Could not find or load " + q + ".";
      renderGrid([]);
    });
  }

  searchBtn.addEventListener("click", runSearch);
  searchInput.addEventListener("keydown", function (e) { if (e.key === "Enter") runSearch(); });
  searchInput.addEventListener("input", function () { if (!searchInput.value.trim()) renderGrid(allStocks); });

  loadAll();

  return wrap;
}

function buildWatchlistContent(isMobile) {
  const wrap = el("div", { style: "display:flex;flex-direction:column;gap:16px;" });

  const addCard = el("div", { class: "card" }, [el("span", { class: "card-title" }, ["Add to Watchlist"])]);
  const symbolInput = el("input", { type: "text", placeholder: "e.g. RELIANCE" });

  addCard.appendChild(el("div", { style: "display:flex;gap:8px;align-items:stretch;" }, [symbolInput, addBtn]));
  const addMsg = el("div", { style: "font-size:11px;color:var(--text2);" });
  addCard.appendChild(addMsg);

  const listSlot = el("div");
  wrap.appendChild(addCard);
  wrap.appendChild(listSlot);
  wrap.appendChild(el("div", { class: "disclaimer" }, [DISCLAIMER]));

  let pool = [];

  function renderList() {
    clear(listSlot);
    const items = getWatchlist();
    const card = el("div", { class: "card" }, [el("span", { class: "card-title" }, ["Your Watchlist (" + items.length + ")"])]);
    if (items.length === 0) {
      card.appendChild(el("div", { style: "font-size:12px;color:var(--text2);" }, ["No stocks yet. Add one above, or star a stock on the AI Predictions page."]));
    } else {
      const table = el("table", { style: "font-size:12px;" });
      const thead = el("thead", {}, [el("tr", { style: "color:var(--text2);font-size:11px;text-align:left;" }, [
        el("th", { style: "padding:4px 6px;" }, ["Stock"]),
        el("th", { style: "padding:4px 6px;" }, ["LTP"]),
        el("th", { style: "padding:4px 6px;" }, ["Chg%"]),
        el("th", { style: "padding:4px 6px;" }, ["Direction"]),
        el("th", { style: "padding:4px 6px;" }, ["Prob."]),
        el("th", { style: "padding:4px 6px;" }, [""]),
      ])]);
      const tbody = el("tbody");
      items.forEach(function (it) {
        const live = pool.filter(function (p) { return p.symbol === it.symbol; })[0];
        const merged = live || it;
        const dirColor = merged.direction === "bearish" ? "var(--bearish)" : "var(--bullish)";
        const removeBtn = el("span", { style: "cursor:pointer;color:var(--bearish);font-size:11px;font-weight:600;" }, ["Remove"]);
        removeBtn.addEventListener("click", function () { removeWatchlistItem(it.symbol); renderList(); });
        tbody.appendChild(el("tr", { style: "border-top:1px solid var(--border);" }, [
          el("td", { style: "padding:6px;font-weight:600;white-space:nowrap;" }, [it.symbol]),
          el("td", { style: "padding:6px;white-space:nowrap;" }, [merged.ltp != null ? "\u20B9" + fmtINR(merged.ltp) : "\u2014"]),
          el("td", { style: "padding:6px;white-space:nowrap;color:" + (merged.change_pct >= 0 ? "var(--bullish)" : "var(--bearish)") + ";" }, [merged.change_pct != null ? (merged.change_pct >= 0 ? "+" : "") + merged.change_pct + "%" : "\u2014"]),
          el("td", { style: "padding:6px;text-transform:capitalize;color:" + dirColor + ";font-weight:600;" }, [merged.direction || "\u2014"]),
          el("td", { style: "padding:6px;font-weight:700;color:" + dirColor + ";" }, [merged.probability != null ? merged.probability + "%" : "\u2014"]),
          el("td", { style: "padding:6px;text-align:right;" }, [removeBtn]),
        ]));
      });
      table.appendChild(thead); table.appendChild(tbody);
      card.appendChild(el("div", { style: "overflow-x:auto;" }, [table]));
      card.appendChild(el("div", { style: "font-size:10px;color:var(--text2);margin-top:6px;" }, ["Live figures shown when a stock appears in the latest AI Predictions scan; otherwise the last-known values are shown."]));
    }
    listSlot.appendChild(card);
  }

  addBtn.addEventListener("click", function () {
    const sym = symbolInput.value.trim().toUpperCase();
    addMsg.textContent = "";
    if (!sym) return;
    if (isWatchlisted(sym)) {
      addMsg.textContent = sym + " is already on your watchlist.";
      return;
    }
    const live = pool.filter(function (p) { return p.symbol === sym; })[0];
    upsertWatchlistItem(live ? Object.assign({ added_at: Date.now() }, live) : { symbol: sym, added_at: Date.now() });
    symbolInput.value = "";
    renderList();
  });

  renderList();

  Promise.all([
    apiFetch("/dashboard/top-bullish").catch(function () { return { stocks: [] }; }),
    apiFetch("/dashboard/top-bearish").catch(function () { return { stocks: [] }; }),
  ]).then(function (results) {
    pool = (results[0].stocks || []).map(function (s) { return Object.assign({}, s, { direction: "bullish" }); })
      .concat((results[1].stocks || []).map(function (s) { return Object.assign({}, s, { direction: "bearish" }); }));
    const items = getWatchlist();
    items.forEach(function (it) {
      const live = pool.filter(function (p) { return p.symbol === it.symbol; })[0];
      if (live) upsertWatchlistItem(Object.assign({ added_at: it.added_at }, live));
    });
    renderList();
  });

  return wrap;
}

        el("span", { style: "font-size:10px;color:var(--text2);" }, ["Checked against the latest scanner pass"]),
      ]),
    ]);
    if (rules.length === 0) {
      card.appendChild(el("div", { style: "font-size:12px;color:var(--text2);" }, ["No alert rules yet. Add one above \u2014 for example, RELIANCE bullish probability \u2265 70%."]));
    } else {
      const list = el("div", { style: "display:flex;flex-direction:column;gap:8px;" });
      rules.forEach(function (rule) {
        const match = pool.filter(function (p) { return p.symbol === rule.symbol && p.direction === rule.direction; })[0];
        const triggered = match && match.probability >= rule.threshold;
        const chip = buildAlertRuleChip(rule, function () { removeAlertRule(rule.id); checkRules(); });
        if (triggered) {
          chip.style.borderColor = "var(--bullish)";
          chip.style.background = "var(--call-bg)";
          chip.insertBefore(el("span", { style: "font-size:11px;font-weight:700;color:var(--bullish);flex-shrink:0;" }, ["TRIGGERED \u2014 " + match.probability + "%"]), chip.lastChild);
          notifyIfEnabled("Alert triggered: " + rule.symbol, rule.symbol + " " + rule.direction + " probability is now " + match.probability + "%.");
        }
        list.appendChild(chip);
      });
      card.appendChild(list);
    }
    clear(rulesSlot);
    rulesSlot.appendChild(card);
  }

  addBtn.addEventListener("click", function () {
    const sym = symbolInput.value.trim().toUpperCase();
    addMsg.textContent = "";
    if (!sym) { addMsg.textContent = "Enter a symbol first."; return; }
    addAlertRule({ symbol: sym, direction: dirSelect.value, threshold: Number(thresholdSelect.value) });
    symbolInput.value = "";
    checkRules();
  });

  Promise.all([
    apiFetch("/dashboard/top-bullish").catch(function () { return { stocks: [] }; }),
    apiFetch("/dashboard/top-bearish").catch(function () { return { stocks: [] }; }),
  ]).then(function (results) {
    pool = (results[0].stocks || []).map(function (s) { return Object.assign({}, s, { direction: "bullish" }); })
      .concat((results[1].stocks || []).map(function (s) { return Object.assign({}, s, { direction: "bearish" }); }));
    checkRules();
  }).catch(function () { checkRules(); });

  apiFetch("/signals/history").then(function (rows) {
    clear(signalLogSlot);
    signalLogSlot.appendChild(el("span", { class: "card-title" }, ["Signal Log"]));
    if (!rows || rows.length === 0) {
      signalLogSlot.appendChild(el("div", { style: "font-size:12px;color:var(--text2);" }, ["No signals logged yet. Signals are recorded automatically when a trade setup is generated."]));
      return;
    }
    const table = el("table", { style: "font-size:12px;" });
    const thead = el("thead", {}, [el("tr", { style: "color:var(--text2);font-size:11px;text-align:left;" }, [
      el("th", { style: "padding:4px 6px;" }, ["Symbol"]), el("th", { style: "padding:4px 6px;" }, ["Dir."]),
      el("th", { style: "padding:4px 6px;" }, ["Entry"]), el("th", { style: "padding:4px 6px;" }, ["Target"]),
      el("th", { style: "padding:4px 6px;" }, ["SL"]), el("th", { style: "padding:4px 6px;" }, ["Prob."]),
      el("th", { style: "padding:4px 6px;" }, ["Result"]),
    ])]);
    const tbody = el("tbody");
    rows.slice(0, 25).forEach(function (r) {
      const dirColor = r.direction === "bearish" ? "var(--bearish)" : "var(--bullish)";
      tbody.appendChild(el("tr", { style: "border-top:1px solid var(--border);" }, [
        el("td", { style: "padding:5px 6px;font-weight:600;white-space:nowrap;" }, [r.symbol]),
        el("td", { style: "padding:5px 6px;text-transform:capitalize;color:" + dirColor + ";" }, [r.direction]),
        el("td", { style: "padding:5px 6px;" }, [fmtINR(r.entry_price)]),
        el("td", { style: "padding:5px 6px;" }, [fmtINR(r.target_1)]),
        el("td", { style: "padding:5px 6px;" }, [fmtINR(r.stop_loss)]),
        el("td", { style: "padding:5px 6px;font-weight:700;" }, [r.predicted_probability + "%"]),
        el("td", { style: "padding:5px 6px;" }, [r.result || "\u2014"]),
      ]));
    });
    table.appendChild(thead); table.appendChild(tbody);
    signalLogSlot.appendChild(el("div", { style: "overflow-x:auto;" }, [table]));
  }).catch(function () {
    clear(signalLogSlot);
    signalLogSlot.appendChild(el("span", { class: "card-title" }, ["Signal Log"]));
    signalLogSlot.appendChild(el("div", { style: "font-size:12px;color:var(--bearish);" }, ["Could not load the signal log from the backend."]));
  });

  return wrap;
}

  }).catch(function () {
    clear(heatmapCard);
    heatmapCard.appendChild(el("span", { class: "card-title" }, ["Stock Heatmap"]));
    heatmapCard.appendChild(el("div", { style: "font-size:12px;color:var(--bearish);" }, ["Could not load heatmap data from the backend."]));
  });

  apiFetch("/dashboard/top-bullish").then(function (data) {
    clear(stocksCardSlot);
    stocksCardSlot.appendChild(buildStockCard(data.stocks, null));
  }).catch(function () {
    clear(stocksCardSlot);
    stocksCardSlot.appendChild(buildStockCard(FALLBACK_STOCKS, "Could not load live data from the backend \u2014 showing local sample data instead."));
  });

  return wrap;
}

// ---------------------------------------------------------------------------
// APP SHELL (sidebar + mobile nav + page routing)
// ---------------------------------------------------------------------------
function buildHeaderStats() {
  const strip = el("div", { class: "stat-strip", style: "display:flex;align-items:center;gap:6px;" });
  const badge = el("span", { style: "flex-shrink:0;font-size:9px;font-weight:700;padding:3px 7px;border-radius:10px;background:var(--border);color:var(--text2);" }, ["\u2026"]);
  const boxesWrap = el("div", { style: "display:flex;gap:6px;overflow-x:auto;" });
  strip.appendChild(badge);
  strip.appendChild(boxesWrap);
  const loadingBox = el("div", { style: "font-size:11px;color:var(--text2);padding:4px 8px;" }, ["Loading market data\u2026"]);
  boxesWrap.appendChild(loadingBox);

  const boxNodes = {}; // label -> {box, valEl, chgEl, lastVal}

  function fmtChange(d) {
    // Matches Angel One's own display: "-144.05 (-0.61%)" - point change and
    // percent change shown together, not percent alone.
    if (d.change_abs === undefined || d.change_abs === null) {
      if (d.change_pct === undefined) return null;
      return (d.change_pct >= 0 ? "+" : "") + d.change_pct + "%";
    }
    const sign = d.change_abs >= 0 ? "+" : "";
    return sign + fmtINR(d.change_abs) + " (" + sign + d.change_pct + "%)";
  }

  function flash(el2, up) {
    // Brief colour flash on the value itself when it changes - this is
    // what makes numbers feel "live" (like Angel One's own ticker) instead
    // of the whole row silently jumping to a new value every refresh.
    el2.style.transition = "none";
    el2.style.color = up ? "var(--bullish)" : "var(--bearish)";
    el2.style.background = up ? "var(--call-bg)" : "var(--put-bg)";
    requestAnimationFrame(function () {
      el2.style.transition = "color 1.2s ease, background 1.2s ease";
      el2.style.color = "var(--text)";
      el2.style.background = "transparent";
    });
  }

  function upsertBox(label, d) {
    if (!d) return;
    const val = d.ltp !== undefined ? fmtINR(d.ltp) : String(d.value);
    const chgText = fmtChange(d);
    const chgUp = (d.change_abs !== undefined && d.change_abs !== null) ? d.change_abs >= 0 : (d.change_pct >= 0);
    let node = boxNodes[label];
    if (!node) {
      const valEl = el("span", { class: "sval" }, [val]);
      const chgEl = el("span", { class: "schg" }, [chgText || ""]);
      const box = el("div", { class: "stat-box" }, [el("span", { class: "sname" }, [label]), valEl, chgEl]);
      boxesWrap.appendChild(box);
      node = { box: box, valEl: valEl, chgEl: chgEl, lastVal: val };
      boxNodes[label] = node;
    }
    if (node.lastVal !== val) {
      flash(node.valEl, chgUp);
      node.lastVal = val;
    }
    node.valEl.textContent = val;
    if (chgText !== null) {
      node.chgEl.textContent = chgText;
      node.chgEl.style.color = chgUp ? "var(--bullish)" : "var(--bearish)";
    }
  }

  function refresh() {
    apiFetch("/dashboard/overview").then(function (data) {
      if (data.live_data) {
        badge.textContent = "\u25cf LIVE";
        badge.style.background = "var(--call-bg)";
        badge.style.color = "var(--bullish)";
      } else {
        badge.textContent = "\u25cf MOCK";
        badge.style.background = "var(--strike-bg)";
        badge.style.color = "var(--text2)";
      }
      const rows = [
        ["NIFTY", data.NIFTY], ["BANK NIFTY", data.BANK_NIFTY], ["SENSEX", data.SENSEX],
        ["INDIA VIX", data.INDIA_VIX], ["ADX", data.ADX], ["RSI", data.RSI],
      ];
      if (loadingBox.parentNode) clear(boxesWrap);
      rows.forEach(function (r) { upsertBox(r[0], r[1]); });
    }).catch(function () {
      badge.textContent = "\u25cf ERR";
      badge.style.background = "var(--put-bg)";
      badge.style.color = "var(--bearish)";
    });
  }
  refresh();
  // Ticker now makes one API call instead of two (commodities removed) -
  // polling every 10s instead of 5s halves the request rate again on top
  // of that, which matters most on a slow/free-tier backend.
  setInterval(refresh, 10000);
  strip.refreshData = refresh;
  return strip;
}

function renderApp(root, onLogout) {
  clear(root);
  const isMobile = window.innerWidth < 900;
  let active = "marketview";

  const shell = el("div", { style: "background:var(--bg);color:var(--text);min-height:100vh;" });

  // header
  const header = el("div", { style: "height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:var(--card);z-index:10;gap:12px;" });
  const brand = el("div", { style: "display:flex;align-items:center;gap:10px;" }, [
    el("div", { style: "width:28px;height:28px;border-radius:8px;background:var(--ai);display:flex;align-items:center;justify-content:center;flex-shrink:0;" }, [icon("brain", 16, "#fff")]),
  ]);
  if (!isMobile) brand.appendChild(el("span", { style: "font-weight:700;font-size:14px;white-space:nowrap;" }, ["TRADE MAP"]));
  const headerStats = buildHeaderStats();
  const refreshBtn = el("div", { class: "menu-toggle refresh-btn", title: "Refresh all data" }, [icon("refresh", 16, "var(--text2)")]);
  const rightControls = el("div", { style: "display:flex;align-items:center;gap:12px;flex-shrink:0;" }, [
    refreshBtn,
    el("span", { style: "display:flex;align-items:center;gap:4px;font-size:12px;color:var(--bullish);" }, [icon("circle", 8, "var(--bullish)"), " Live"]),
    icon("bell", 16, "var(--text2)"),
  ]);
  const logoutIcon = el("div", { style: "cursor:pointer;", title: "Log out" }, [icon("user", 16, "var(--text2)")]);
  logoutIcon.addEventListener("click", onLogout);
  rightControls.appendChild(logoutIcon);
  header.appendChild(brand); header.appendChild(headerStats); header.appendChild(rightControls);
  refreshBtn.addEventListener("click", function () {
    if (refreshBtn.classList.contains("spin")) return; // already refreshing, ignore extra taps
    refreshBtn.classList.add("spin");
    headerStats.refreshData();
    renderPage();
    setTimeout(function () { refreshBtn.classList.remove("spin"); }, 700);
  });

  // top pill tab-strip (replaces the old hamburger sidebar - only 4 pages
  // now, so a persistent horizontal strip like the reference screenshots
  // fits fine on both desktop and mobile).
  const tabStrip = el("div", { style: "display:flex;gap:6px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:9;overflow-x:auto;" });
  let tabNodes = [];
  NAV_ITEMS.forEach(function (item) {
    const node = el("button", {
      type: "button",
      style: "flex-shrink:0;padding:8px 14px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:700;letter-spacing:0.3px;white-space:nowrap;" +
        (item.key === active ? "background:var(--bullish);color:#04150C;border-color:var(--bullish);" : "background:transparent;color:var(--text2);"),
    }, [item.label.toUpperCase()]);
    node.addEventListener("click", function () {
      active = item.key;
      tabNodes.forEach(function (n) {
        n.el.style.background = n.key === active ? "var(--bullish)" : "transparent";
        n.el.style.color = n.key === active ? "#04150C" : "var(--text2)";
        n.el.style.borderColor = n.key === active ? "var(--bullish)" : "var(--border)";
      });
      renderPage();
    });
    tabNodes.push({ el: node, key: item.key });
    tabStrip.appendChild(node);
  });

  // body: content
  const body = el("div", { style: "display:flex;" });
  const contentArea = el("div", { style: "flex:1;padding:20px;padding-bottom:" + (isMobile ? "20px" : "20px") + ";min-width:0;" });

  function renderPage() {
    clear(contentArea);
    if (active === "marketview") {
      contentArea.appendChild(buildScannerContent(isMobile));
    } else if (active === "niftydata") {
      contentArea.appendChild(buildOptionChainPageContent(isMobile, "index", false));
    } else if (active === "stockfno") {
      contentArea.appendChild(buildTopStocksContent(isMobile));
    } else if (active === "optionchain") {
      contentArea.appendChild(buildOptionChainPageContent(isMobile, "stock", true));
    } else {
      const item = NAV_ITEMS.filter(function (n) { return n.key === active; })[0];
      contentArea.appendChild(buildComingSoon(item ? item.label : "Market View"));
    }
  }

  body.appendChild(contentArea);

  shell.appendChild(header);
  shell.appendChild(tabStrip);
  shell.appendChild(body);

  root.appendChild(shell);
  renderPage();
}

// ---------------------------------------------------------------------------
// SPLASH SCREEN (shown full-screen for a moment when the app is opened)
// ---------------------------------------------------------------------------
function showSplashScreen(onDone) {
  const splash = el("div", {
    style: "position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;" +
      "align-items:center;justify-content:center;gap:18px;z-index:9999;",
  }, [
    el("img", { src: APP_LOGO_DATA_URI, alt: "Trade Map", style: "width:160px;height:160px;object-fit:contain;" }),
    el("span", { style: "font-weight:700;font-size:26px;letter-spacing:1px;color:var(--text);" }, ["TRADE MAP"]),
  ]);
  document.body.appendChild(splash);
  setTimeout(function () {
    splash.style.transition = "opacity 0.3s ease";
    splash.style.opacity = "0";
    setTimeout(function () {
      splash.remove();
      onDone();
    }, 300);
  }, 1200);
}

// ---------------------------------------------------------------------------
// APP BOOTSTRAP
// ---------------------------------------------------------------------------
function boot() {
  const root = document.getElementById("root");
  function showAuth() { renderAuthScreen(root, showDashboard); }
  function showDashboard() { renderApp(root, function () { clearToken(); showAuth(); }); }
  showSplashScreen(function () {
    if (getToken()) showDashboard(); else showAuth();
  });
}
boot();
</script>
